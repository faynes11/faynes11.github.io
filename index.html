<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я опоздал, потому что...</title>
    <style>
        :root {
            --bg-dark: #0e0e10;
            --text-color: #f3f3f4;
            --crimson-glow: rgba(185, 28, 48, 0.35);
            --slot-border: rgba(155, 34, 48, 0.45);
            --gold-bg: rgba(145, 110, 40, 0.25);
            --gold-color: #d9b668;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            max-width: 100vw;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 50% 48%, rgba(165, 20, 35, 0.22) 0%, rgba(14, 14, 16, 0.94) 62%),
                repeating-linear-gradient(115deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 2px, transparent 2px, transparent 9px),
                repeating-linear-gradient(25deg, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 4px, transparent 4px, transparent 14px),
                radial-gradient(ellipse at 20% 30%, #1c1c1f 0%, #0a0a0c 100%);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .made-by {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: linear-gradient(180deg, rgba(34, 24, 26, 0.9) 0%, rgba(20, 20, 22, 0.94) 100%);
            color: #c9b8ba;
            border: 1px solid rgba(155, 34, 48, 0.35);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            pointer-events: none;
        }

        .secret-btn {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: linear-gradient(180deg, rgba(48, 24, 30, 0.95) 0%, rgba(22, 18, 20, 0.97) 100%);
            color: #f0c4ca;
            border: 1px solid rgba(195, 38, 56, 0.52);
            padding: 6px 13px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.55),
                0 0 16px rgba(175, 22, 38, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
            transition: all 0.15s ease;
        }

        .secret-btn:hover {
            border-color: rgba(225, 55, 75, 0.85);
            color: #ffffff;
        }

        .secret-btn:active {
            transform: scale(0.96);
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.76);
            backdrop-filter: blur(7px);
            -webkit-backdrop-filter: blur(7px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
            box-sizing: border-box;
        }

        .modal-backdrop.active {
            display: flex;
        }

        .modal-card {
            background: linear-gradient(180deg, rgba(38, 24, 27, 0.98) 0%, rgba(18, 18, 20, 0.99) 100%);
            border: 1px solid rgba(185, 34, 52, 0.5);
            border-radius: 22px;
            padding: 24px 20px;
            width: 100%;
            max-width: 360px;
            max-height: 82vh;
            overflow-y: auto;
            text-align: center;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.9),
                0 0 40px rgba(165, 20, 35, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        .modal-title {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--gold-color);
            margin-bottom: 12px;
        }

        .modal-text {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #f3f3f4;
            margin-bottom: 20px;
        }

        .jp-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .jp-item {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 14px;
            overflow: hidden;
        }

        .jp-item.unlocked {
            border-color: rgba(242, 198, 92, 0.55);
            background: linear-gradient(180deg, rgba(64, 48, 20, 0.35) 0%, rgba(26, 22, 16, 0.5) 100%);
        }

        .jp-item-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .jp-status-open {
            color: #ffd875;
        }

        .jp-status-locked {
            color: #9b93a0;
        }

        .jp-secret-box {
            position: relative;
            border-radius: 9px;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .jp-combo {
            font-size: 13px;
            font-weight: 700;
            color: #f4f3f6;
            line-height: 1.35;
            transition: filter 0.25s ease, opacity 0.25s ease;
        }

        .jp-item.locked-jp .jp-combo {
            filter: blur(8px);
            -webkit-filter: blur(8px);
            opacity: 0.35;
            user-select: none;
            transform: scale(1.02);
        }

        .jp-blur-veil {
            display: none;
        }

        .jp-item.locked-jp .jp-blur-veil {
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            inset: 0;
            background: rgba(18, 16, 22, 0.55);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #b5acb9;
            pointer-events: none;
        }

        .modal-close {
            width: 100%;
            background: linear-gradient(180deg, #9c192b 0%, #78101e 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 110, 130, 0.25);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 6px 18px var(--crimson-glow);
            transition: transform 0.12s ease;
        }

        .modal-close:active {
            transform: scale(0.97);
        }

        .stage-wrap {
            position: relative;
            width: 100%;
            max-width: 400px;
            padding-top: 42px;
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .top-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .mini-btn {
            background: linear-gradient(180deg, rgba(42, 26, 29, 0.95) 0%, rgba(20, 18, 21, 0.98) 100%);
            color: #e8d2d5;
            border: 1px solid rgba(185, 34, 52, 0.45);
            padding: 7px 11px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.15s ease;
        }

        .mini-btn:hover {
            border-color: rgba(220, 50, 70, 0.75);
            color: #ffffff;
        }

        .mini-btn:active {
            transform: scale(0.96);
        }

        .mini-btn.muted {
            color: #968c8e;
            border-color: rgba(255, 255, 255, 0.12);
        }

        .mini-btn.life-mode {
            color: #f0d79c;
            border-color: rgba(217, 182, 104, 0.45);
        }

        .mini-btn.jp-btn {
            color: #ffe08a;
            border-color: rgba(242, 198, 92, 0.5);
        }

        .widget-box {
            position: relative;
            width: 100%;
        }

        .aura-canvas {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw;
            height: 100vh;
            max-width: 720px;
            max-height: 720px;
            z-index: 0;
            pointer-events: none;
            opacity: 0.98;
            -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 28%, rgba(0,0,0,0.45) 55%, transparent 82%);
            mask-image: radial-gradient(circle at 50% 50%, #000 28%, rgba(0,0,0,0.45) 55%, transparent 82%);
        }

        .widget-container {
            background: linear-gradient(180deg, rgba(34, 24, 26, 0.92) 0%, rgba(20, 20, 22, 0.96) 35%, rgba(18, 18, 20, 0.98) 100%);
            padding: 24px 20px;
            border-radius: 26px;
            width: 100%;
            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.85),
                0 0 45px rgba(150, 20, 35, 0.22),
                inset 0 1px 1px rgba(255, 255, 255, 0.12);
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            z-index: 2;
            overflow: hidden;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .widget-container.jackpot {
            border-color: rgba(255, 214, 92, 0.95);
            box-shadow:
                0 25px 65px rgba(0, 0, 0, 0.9),
                0 0 70px rgba(255, 192, 52, 0.65),
                inset 0 0 28px rgba(255, 208, 85, 0.25);
            animation: jackpotPulseGold 0.9s ease-in-out 2;
        }

        .gold-flash {
            position: absolute;
            inset: -12px;
            pointer-events: none;
            z-index: 15;
            opacity: 0;
            background:
                radial-gradient(circle at 50% 45%, rgba(255, 232, 145, 0.65) 0%, rgba(245, 175, 42, 0.25) 45%, transparent 75%);
        }

        .widget-container.jackpot .gold-flash {
            animation: goldSweep 1.1s ease-out forwards;
        }

        @keyframes goldSweep {
            0% { opacity: 0; transform: scale(0.88); }
            25% { opacity: 1; transform: scale(1.04); }
            100% { opacity: 0; transform: scale(1.18); }
        }

        @keyframes jackpotPulseGold {
            0% { transform: scale(1); }
            30% { transform: scale(1.025) rotate(-0.6deg); }
            60% { transform: scale(1.02) rotate(0.6deg); }
            100% { transform: scale(1); }
        }

        .spark {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff7c2 0%, #ffbe2e 65%, transparent 100%);
            box-shadow: 0 0 12px #ffd24c;
            pointer-events: none;
            z-index: 16;
            animation: sparkFly 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes sparkFly {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy)) scale(0.1);
            }
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 4px;
            gap: 8px;
        }

        .title {
            font-size: 14px;
            font-weight: 600;
            color: #d8d8dc;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .spin-counter {
            font-size: 11px;
            font-weight: 700;
            color: #b7b3b8;
            letter-spacing: 0.4px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 3px 9px;
            border-radius: 12px;
        }

        .badge {
            background-color: var(--gold-bg);
            color: var(--gold-color);
            border: 1px solid rgba(217, 182, 104, 0.35);
            padding: 3px 11px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .badge.jackpot-badge {
            background: linear-gradient(180deg, #ffe38a 0%, #d4941c 100%);
            color: #1a1205;
            border-color: rgba(255, 240, 175, 0.95);
            box-shadow: 0 0 16px rgba(255, 200, 60, 0.75);
        }

        .sub-hint {
            font-size: 11px;
            color: #9e98a0;
            padding: 0 4px;
            margin-bottom: 16px;
            min-height: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .jackpot-label {
            color: #ffe184;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(255, 195, 50, 0.65);
        }

        .slots-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 22px;
        }

        .slot {
            background:
                repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px),
                linear-gradient(180deg, #1b1b1e 0%, #111113 100%);
            padding: 18px 42px 18px 16px;
            border-radius: 14px;
            text-align: center;
            font-size: 19px;
            font-weight: 700;
            color: #f0f0f2;
            border: 1px solid var(--slot-border);
            min-height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.85),
                0 1px 0 rgba(255, 255, 255, 0.04);
            overflow: hidden;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        .slot.empty .slot-text {
            color: #6e6973;
            letter-spacing: 2px;
        }

        .slot:hover {
            border-color: rgba(217, 182, 104, 0.55);
        }

        .slot.locked {
            border-color: rgba(217, 182, 104, 0.8);
            background:
                repeating-linear-gradient(90deg, rgba(217,182,104,0.03) 0px, rgba(217,182,104,0.03) 1px, transparent 1px, transparent 3px),
                linear-gradient(180deg, #241f18 0%, #16130f 100%);
            box-shadow:
                inset 0 0 14px rgba(217, 182, 104, 0.14),
                0 0 12px rgba(217, 182, 104, 0.16);
        }

        .lock-indicator {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            opacity: 0.45;
            transition: opacity 0.15s ease, transform 0.15s ease;
            pointer-events: none;
        }

        .slot.locked .lock-indicator {
            opacity: 1;
            transform: translateY(-50%) scale(1.1);
        }

        .slot.spinning {
            border-color: rgba(235, 55, 75, 0.9);
            box-shadow:
                inset 0 0 18px rgba(185, 28, 48, 0.35),
                0 0 16px rgba(185, 28, 48, 0.28);
            animation: reelPulse 0.12s linear infinite;
        }

        .slot.landed {
            transform: scale(1.02);
            border-color: rgba(217, 182, 104, 0.75);
            box-shadow:
                inset 0 2px 6px rgba(0, 0, 0, 0.85),
                0 0 16px rgba(217, 182, 104, 0.22);
        }

        @keyframes reelPulse {
            0% { transform: translateY(-2px); opacity: 0.85; }
            50% { transform: translateY(2px); opacity: 1; }
            100% { transform: translateY(-2px); opacity: 0.85; }
        }

        .controls {
            display: flex;
            gap: 12px;
            position: relative;
        }

        .spin-btn {
            flex-grow: 1;
            background: linear-gradient(180deg, #b81d33 0%, #7d0f1e 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 120, 138, 0.32);
            padding: 17px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow:
                0 8px 24px var(--crimson-glow),
                inset 0 1px 0 rgba(255, 255, 255, 0.22);
            transition: all 0.15s ease;
        }

        .spin-btn:active {
            transform: scale(0.97);
            box-shadow: 0 4px 12px var(--crimson-glow);
        }

        .spin-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spin-btn::after {
            content: '';
            display: inline-block;
            width: 11px;
            height: 11px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 18px rgba(255, 255, 255, 0.8);
        }

        .copy-btn {
            background: linear-gradient(180deg, #252427 0%, #1c1b1e 100%);
            color: #a83240;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 58px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
            position: relative;
        }

        .copy-btn svg {
            width: 22px;
            height: 22px;
            stroke: #a63240;
            transition: stroke 0.2s ease;
        }

        .copy-btn:hover svg {
            stroke: #d44254;
        }

        .copy-btn:active {
            transform: scale(0.96);
        }

        .toast {
            position: absolute;
            right: 0;
            bottom: calc(100% + 10px);
            background: linear-gradient(180deg, rgba(48, 34, 24, 0.98) 0%, rgba(24, 20, 18, 0.98) 100%);
            color: #ffe39e;
            border: 1px solid rgba(217, 182, 104, 0.55);
            padding: 7px 12px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.75);
            opacity: 0;
            transform: translateY(6px);
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body>

<div class="made-by">сделано михуньчиком ❤️</div>
<button class="secret-btn" onclick="openSecret()">ТЫК 👆</button>

<div class="modal-backdrop" id="secretModal" onclick="handleBackdropClick(event, 'secretModal')">
    <div class="modal-card">
        <div class="modal-title">Секрет раскрыт</div>
        <div class="modal-text">дилюрка лох</div>
        <button class="modal-close" onclick="closeModal('secretModal')">Закрыть</button>
    </div>
</div>

<div class="modal-backdrop" id="jackpotsModal" onclick="handleBackdropClick(event, 'jackpotsModal')">
    <div class="modal-card">
        <div class="modal-title" id="jpModalTitle">Джекпоты (0/7)</div>
        <div class="jp-list" id="jpList"></div>
        <button class="modal-close" onclick="closeModal('jackpotsModal')">Закрыть</button>
    </div>
</div>

<div class="stage-wrap">
    <div class="top-bar">
        <div class="top-group">
            <button class="mini-btn" id="toneBtn" onclick="toggleTone()" title="Переключить стиль отмазок">
                <span id="toneIcon">🤪</span>
                <span id="toneLabel">АБСУРД</span>
            </button>
            <button class="mini-btn jp-btn" id="jpBtn" onclick="openJackpotsModal()" title="Список джекпотов">
                <span>🏆</span>
                <span id="jpBtnLabel">ДЖЕКПОТЫ 0/7</span>
            </button>
        </div>

        <button class="mini-btn" id="soundBtn" onclick="toggleSound()" title="Переключить звук прокрутки">
            <span id="soundIcon">🔊</span>
            <span id="soundLabel">ЗВУК ВКЛ</span>
        </button>
    </div>

    <div class="widget-box">
        <canvas class="aura-canvas" id="auraCanvas"></canvas>

        <div class="widget-container" id="widgetCard">
            <div class="gold-flash"></div>
            <div class="header">
                <span class="title">Я опоздал, потому что...</span>
                <div class="header-right">
                    <span class="spin-counter" id="spinCounter">#0</span>
                    <span class="badge" id="mainBadge">SLOTS</span>
                </div>
            </div>
            <div class="sub-hint">
                <span>Клик по ячейке — закрепить</span>
                <span class="jackpot-label" id="jackpotBanner"></span>
            </div>
            <div class="slots-wrapper">
                <div class="slot empty" id="slot1" onclick="toggleLock(0)">
                    <span class="slot-text">—</span>
                    <span class="lock-indicator" id="lockIcon0">🔓</span>
                </div>
                <div class="slot empty" id="slot2" onclick="toggleLock(1)">
                    <span class="slot-text">—</span>
                    <span class="lock-indicator" id="lockIcon1">🔓</span>
                </div>
                <div class="slot empty" id="slot3" onclick="toggleLock(2)">
                    <span class="slot-text">—</span>
                    <span class="lock-indicator" id="lockIcon2">🔓</span>
                </div>
            </div>
            <div class="controls">
                <div class="toast" id="copyToast">Скопировано</div>

    (function initCenterRaysAura() {
        const canvas = document.getElementById('auraCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resize();
        window.addEventListener('resize', resize);

        const rays = [
            { angle: -2.65, jitter: 0.24, freq: 5.2, speed: 1.9, phase: 0.2,  length: 0.56, width: 14 },
            { angle: -2.15, jitter: 0.28, freq: 6.1, speed: 2.3, phase: 1.4,  length: 0.62, width: 16 },
            { angle: -1.55, jitter: 0.22, freq: 4.8, speed: 1.6, phase: 2.6,  length: 0.54, width: 13 },
            { angle: -0.92, jitter: 0.27, freq: 5.8, speed: 2.1, phase: 3.8,  length: 0.60, width: 15 },
            { angle: -0.35, jitter: 0.25, freq: 6.4, speed: 2.4, phase: 0.9,  length: 0.58, width: 14 },
            { angle:  0.32, jitter: 0.26, freq: 5.0, speed: 1.8, phase: 2.1,  length: 0.57, width: 14 },
            { angle:  0.95, jitter: 0.29, freq: 6.2, speed: 2.2, phase: 3.4,  length: 0.62, width: 16 },
            { angle:  1.58, jitter: 0.23, freq: 4.9, speed: 1.7, phase: 4.7,  length: 0.55, width: 13 },
            { angle:  2.22, jitter: 0.28, freq: 5.9, speed: 2.0, phase: 1.1,  length: 0.61, width: 15 },
            { angle:  2.78, jitter: 0.25, freq: 5.5, speed: 1.9, phase: 2.9,  length: 0.56, width: 14 }
        ];

        let t = 0;
        let lastTime = performance.now();

        function drawRay(cx, cy, maxR, ray, time) {
            const steps = 36;
            const len = maxR * ray.length * (0.88 + Math.sin(time * 1.4 + ray.phase) * 0.12 + auraBoost * 0.18);
            const pts = [];

            for (let i = 0; i <= steps; i++) {
                const u = i / steps;
                const dist = u * len;
                const sway =
                    Math.sin(u * ray.freq + time * ray.speed + ray.phase) * ray.jitter * u +
                    Math.cos(u * (ray.freq * 1.7) - time * (ray.speed * 1.3) + ray.phase * 1.5) * (ray.jitter * 0.45) * u;
                const a = ray.angle + sway;
                pts.push({
                    x: cx + Math.cos(a) * dist,
                    y: cy + Math.sin(a) * dist
                });
            }

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = `rgba(215, 28, 56, ${0.42 + auraBoost * 0.18})`;
            ctx.lineWidth = ray.width * (2.2 + auraBoost * 0.6);
            ctx.shadowColor = 'rgba(225, 32, 62, 0.75)';
            ctx.shadowBlur = 22 + auraBoost * 12;
            ctx.stroke();

            const endP = pts[pts.length - 1];
            const grad = ctx.createLinearGradient(cx, cy, endP.x, endP.y);
            grad.addColorStop(0, 'rgba(255, 210, 195, 0.95)');
            grad.addColorStop(0.45, 'rgba(255, 85, 115, 0.85)');
            grad.addColorStop(1, 'rgba(210, 25, 55, 0)');

            ctx.beginPath();
            pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = grad;
            ctx.lineWidth = ray.width * (0.45 + auraBoost * 0.2);
            ctx.shadowColor = 'rgba(255, 115, 135, 0.9)';
            ctx.shadowBlur = 10;
            ctx.stroke();

            ctx.restore();
        }

        function frame(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            auraBoost = Math.max(0, auraBoost - dt * 0.55);
            t += dt * (1.0 + auraBoost * 2.1);

            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            const cx = w * 0.5;
            const cy = h * 0.5;
            const maxR = Math.max(w, h) * 0.5;

            ctx.clearRect(0, 0, w, h);

            const coreGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, maxR * 0.45);
            coreGlow.addColorStop(0, `rgba(235, 42, 70, ${0.52 + auraBoost * 0.2})`);
            coreGlow.addColorStop(0.6, `rgba(155, 18, 42, ${0.22 + auraBoost * 0.1})`);
            coreGlow.addColorStop(1, 'rgba(14, 14, 16, 0)');
            ctx.fillStyle = coreGlow;
            ctx.fillRect(0, 0, w, h);

            ctx.globalCompositeOperation = 'lighter';
            for (const ray of rays) {
                drawRay(cx, cy, maxR, ray, t);
            }
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    })();

    function ensureAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) {
            audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        return audioCtx;
    }

    function playTickSound(progress = 0) {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        const baseFreq = 520 - progress * 160 + (Math.random() * 60 - 30);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.028);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.03);
    }

    function playStopSound(reelIndex = 0) {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        const freq = 220 + reelIndex * 55;
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.09);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.095);
    }

    function playJackpotSound() {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((freq, i) => {
            const now = ctx.currentTime + i * 0.075;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.29);
        });
    }

    function spawnGoldSparks() {
        const card = document.getElementById('widgetCard');
        const count = 24;
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('span');
            spark.className = 'spark';
            const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.3 - 0.15);
            const dist = 70 + Math.random() * 110;
            spark.style.left = '50%';
            spark.style.top = '48%';
            spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
            spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
            card.appendChild(spark);
            setTimeout(() => spark.remove(), 1000);
        }
    }

    function toggleSound() {
        isSoundEnabled = !isSoundEnabled;
        applySoundUI();
        saveMemory();
        if (isSoundEnabled) {
            playStopSound(1);
        }
    }

    function toggleTone() {
        if (isSpinning || isJackpotAnimating) return;
        currentTone = currentTone === 'absurd' ? 'life' : 'absurd';
        applyToneUI();
        saveMemory();
        playStopSound(0);
    }

    function toggleLock(index) {
        if (isSpinning || isJackpotAnimating) return;
        locked[index] = !locked[index];
        const slotEl = document.getElementById(slotIds[index]);
        const iconEl = document.getElementById('lockIcon' + index);

        if (locked[index]) {
            slotEl.classList.add('locked');
            iconEl.innerText = '🔒';
        } else {
            slotEl.classList.remove('locked');
            iconEl.innerText = '🔓';
        }
        saveMemory();
        playStopSound(index);
    }

    function openSecret() {
        document.getElementById('secretModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function handleBackdropClick(event, id) {
        if (event.target.id === id) {
            closeModal(id);
        }
    }

    function getSlotTextEl(id) {
        return document.getElementById(id).querySelector('.slot-text');
    }

    function pickNextWord(array, currentText, history = null) {
        if (array.length <= 1) return array[0];
        const blocked = new Set([currentText, ...(history || [])]);
        const pool = array.filter(item => !blocked.has(item));
        const source = pool.length > 0 ? pool : array.filter(item => item !== currentText);
        return source[Math.floor(Math.random() * source.length)];
    }

    function recordHistory(reelIndex, value) {
        const hist = recentHistory[reelIndex];
        hist.push(value);
        if (hist.length > 4) {
            hist.shift();
        }
    }

    function spinReel(id, array, durationMs, reelIndex) {
        return new Promise(resolve => {
            const element = document.getElementById(id);
            const textEl = getSlotTextEl(id);

            if (locked[reelIndex]) {
                resolve();
                return;
            }

            element.classList.remove('empty', 'landed');
            element.classList.add('spinning');

            const startTime = performance.now();
            let tickDelay = 55;

            function step() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / durationMs, 1);

                if (elapsed >= durationMs) {
                    const finalWord = pickNextWord(array, textEl.innerText, recentHistory[reelIndex]);
                    setSlotDisplay(reelIndex, finalWord);
                    recordHistory(reelIndex, finalWord);
                    element.classList.remove('spinning');
                    element.classList.add('landed');
                    playStopSound(reelIndex);
                    setTimeout(() => element.classList.remove('landed'), 220);
                    resolve();
                    return;
                }

                textEl.innerText = pickNextWord(array, textEl.innerText);
                playTickSound(progress);

                tickDelay = 55 + Math.pow(progress, 2.2) * 145;
                setTimeout(step, tickDelay);
            }

            step();
        });
    }

    function resetJackpotVisual() {
        const card = document.getElementById('widgetCard');
        const badge = document.getElementById('mainBadge');
        const banner = document.getElementById('jackpotBanner');
        card.classList.remove('jackpot');
        badge.classList.remove('jackpot-badge');
        badge.innerText = 'SLOTS';
        banner.innerText = '';
    }

    function triggerJackpotCelebration(jp) {
        const card = document.getElementById('widgetCard');
        const badge = document.getElementById('mainBadge');
        const banner = document.getElementById('jackpotBanner');

        clearTimeout(jackpotUnlockTimer);
        isJackpotAnimating = true;
        syncSpinButtonState();

        resetJackpotVisual();
        void card.offsetWidth;

        card.classList.add('jackpot');
        badge.classList.add('jackpot-badge');
        badge.innerText = 'JACKPOT';
        banner.innerText = `★ ДЖЕКПОТ: ${jp.name} ★`;
        auraBoost = 1.8;

        if (!unlockedIds.includes(jp.id)) {
            unlockedIds.push(jp.id);
            updateJackpotCounterUI();
        }
        saveMemory();

        spawnGoldSparks();
        playJackpotSound();

        jackpotUnlockTimer = setTimeout(() => {
            isJackpotAnimating = false;
            syncSpinButtonState();
        }, 1850);
    }

    function evaluateMatchedJackpot() {
        if (currentTone !== 'absurd') return null;
        const s1 = slotValues[0];
        const s2 = slotValues[1];
        const s3 = slotValues[2];
        if (s1 === EMPTY_SYMBOL || s2 === EMPTY_SYMBOL || s3 === EMPTY_SYMBOL) return null;

        const exact = JACKPOTS.find(jp => jp.who === s1 && jp.action === s2 && jp.target === s3);
        if (exact) return exact;

        const heroMatch = JACKPOTS.find(jp => jp.who === s1);
        if (heroMatch && Math.random() < heroMatch.chance) {
            return heroMatch;
        }
        return null;
    }

    async function spinAll() {
        if (isSpinning || isJackpotAnimating) return;
        if (locked.every(Boolean)) return;

        isSpinning = true;
        syncSpinButtonState();
        auraBoost = 1.1;
        resetJackpotVisual();
        ensureAudioContext();

        spinCount += 1;
        document.getElementById('spinCounter').innerText = '#' + spinCount;
        saveMemory();

        const dict = packs[currentTone];

        await Promise.all([
            spinReel('slot1', dict.who, 1100, 0),
            spinReel('slot2', dict.action, 1550, 1),
            spinReel('slot3', dict.target, 2000, 2)
        ]);

        saveMemory();

        const hit = evaluateMatchedJackpot();
        isSpinning = false;

        if (hit) {
            triggerJackpotCelebration(hit);
        } else {
            syncSpinButtonState();
        }
    }

    function showToast(msg = 'Скопировано') {
        const toast = document.getElementById('copyToast');
        toast.innerText = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    function copyExcuse() {
        const s1 = slotValues[0];
        const s2 = slotValues[1];
        const s3 = slotValues[2];
        if (s1 === EMPTY_SYMBOL || s2 === EMPTY_SYMBOL || s3 === EMPTY_SYMBOL) {
            showToast('Сначала покрути');
            return;
        }
        const fullText = `Я опоздал, потому что ${s1.toLowerCase()} ${s2.toLowerCase()} ${s3.toLowerCase()}.`;

        navigator.clipboard.writeText(fullText).then(() => {
            showToast('Скопировано');
        }).catch(() => {
            prompt("Скопируйте вручную:", fullText);
        });
    }
</script>
