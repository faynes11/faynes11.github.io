<script>
    const GEMINI_API_KEY = 'AQ.Ab8RN6KN9PbOSMRM_xxD6Tie-r5JuFanghgFQ1XpsAtGAE6LQA';

    function openSecret() {
        document.getElementById('secretModal').classList.add('active');
    }

    function closeSecret() {
        document.getElementById('secretModal').classList.remove('active');
    }

    function handleBackdropClick(event) {
        if (event.target.id === 'secretModal') {
            closeSecret();
        }
    }

    async function fetchExcuseFromGemini() {
        if (!GEMINI_API_KEY || GEMINI_API_KEY === 'ВСТАВЬ_СВОЙ_КЛЮЧ_СЮДА') {
            throw new Error('Не указан GEMINI_API_KEY в коде');
        }

        const prompt =
            'Придумай одну смешную и реалистичную отмазку для опоздания на русском языке. ' +
            'Разбей её на 3 короткие части верхним регистром: ' +
            'who (кто/что, 1-3 слова, например "МОЙ ПЁС"), ' +
            'action (действие в прошедшем времени, 1-3 слова, например "СЪЕЛ"), ' +
            'target (объект, 1-3 слова, например "МОЙ ПРОПУСК"). ' +
            'Верни строго валидный JSON без пояснений: {"who":"...","action":"...","target":"..."}';

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`,
            {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: 'application/json',
                        temperature: 1.0
                    }
                })
            }
        );

        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`Ошибка Gemini (${response.status}): ${errText}`);
        }

        const data = await response.json();
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        const parsed = JSON.parse(rawText);

        if (!parsed.who || !parsed.action || !parsed.target) {
            throw new Error('Модель вернула неполный JSON');
        }

        return {
            who: String(parsed.who).trim().toUpperCase(),
            action: String(parsed.action).trim().toUpperCase(),
            target: String(parsed.target).trim().toUpperCase()
        };
    }

    async function spinAll() {
        const spinBtn = document.getElementById('spinBtn');
        const slot1 = document.getElementById('slot1');
        const slot2 = document.getElementById('slot2');
        const slot3 = document.getElementById('slot3');

        spinBtn.disabled = true;
        slot1.classList.add('spinning');
        slot2.classList.add('spinning');
        slot3.classList.add('spinning');

        try {
            const excuse = await fetchExcuseFromGemini();
            slot1.innerText = excuse.who;
            slot2.innerText = excuse.action;
            slot3.innerText = excuse.target;
        } catch (err) {
            console.error(err);
            slot1.innerText = 'ОШИБКА';
            slot2.innerText = 'GEMINI';
            slot3.innerText = err.message.slice(0, 28).toUpperCase();
        } finally {
            slot1.classList.remove('spinning');
            slot2.classList.remove('spinning');
            slot3.classList.remove('spinning');
            spinBtn.disabled = false;
        }
    }

    function copyExcuse() {
        const s1 = document.getElementById('slot1').innerText;
        const s2 = document.getElementById('slot2').innerText;
        const s3 = document.getElementById('slot3').innerText;
        const fullText = `Я опоздал, потому что ${s1.toLowerCase()} ${s2.toLowerCase()} ${s3.toLowerCase()}.`;

        navigator.clipboard.writeText(fullText).then(() => {
            alert('Отмазка скопирована: ' + fullText);
        }).catch(() => {
            prompt("Скопируйте вручную:", fullText);
        });
    }
</script>
