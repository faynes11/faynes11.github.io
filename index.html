<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я опоздал, потому что...</title>
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #ff3b30;
            --slot-border: #333333;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }

        .widget-container {
            background-color: var(--container-bg);
            padding: 24px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            box-sizing: border-box;
            border: 1px solid var(--slot-border);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge {
            background-color: var(--accent-color);
            color: white;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .slots-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .slot {
            background-color: #2a2a2a;
            padding: 16px 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            border: 1px solid var(--slot-border);
            min-height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .slot.spinning {
            opacity: 0.3;
            transform: scale(0.98);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .spin-btn {
            flex-grow: 1;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .spin-btn::after {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0 0 10px white;
        }

        .copy-btn {
            background-color: #3a3a3a;
            color: white;
            border: none;
            padding: 18px;
            width: 58px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="widget-container">
    <div class="header">
        <span class="title">Я опоздал, потому что...</span>
        <span class="badge">PRO</span>
    </div>
    <div class="slots-wrapper">
        <div class="slot" id="slot1">ДЕГЕНЕРАТ</div>
        <div class="slot" id="slot2">СЛОМАЛ</div>
        <div class="slot" id="slot3">МОЙ АВТОБУС</div>
    </div>
    <div class="controls">
        <button class="spin-btn" onclick="spinAll()">КРУТИТЬ</button>
        <button class="copy-btn" onclick="copyExcuse()">📋</button>
    </div>
</div>

<script>
    const dictionary = {
        who: [
            "ДЕД", "СОСЕДКА", "КОТ", "КУРЬЕР", "ИНОПЛАНЕТЯНЕ", "МЭР ГОРОДА", 
            "ВОЕНКОМ", "СВЕКРОВЬ", "АЛКАШ С ДВЕРА", "УЧИТЕЛЬНИЦА", "ЦЫГАНЕ",
            "МОЙ ПЁС", "БЫВШАЯ", "ДРУГ", "ЭКСКАВАТОРЩИК", "ГЕНЕРАЛЬНЫЙ ДИРЕКТОР"
        ],
        action: [
            "СЛОМАЛ", "УГНАЛ", "СЪЕЛ", "ЗАБЛОКИРОВАЛ", "ПОХИТИЛ", "СПРЯТАЛ",
            "ЗАСТАВИЛ МЕНЯ СЛУШАТЬ", "ОТМЕНИЛ", "ПЕРЕЕХАЛ", "ИСПУГАЛ", "ЗАЛИЛ КЛЕЕМ",
            "УТАЩИЛ В НОРУ", "ИСПОРТИЛ", "ВЫКАТИЛ НА ДОРОГУ", "УДАЛИЛ"
        ],
        target: [
            "МОЙ АВТОБУС", "БУДИЛЬНИК", "ЛИФТ", "ПРОПУСК", "ШТАНЫ", "ТОРМОЗА НА ВЕЛИКЕ",
            "ВХОДНУЮ ДВЕРЬ", "МОЙ ЗАВТРАК", "МАРШРУТКУ", ЛЮЧИ ОТ КВАРТИРЫ",
            "ЭЛЕКТРОСАМОКАТ", "БОТИНОК", "РАСПИСАНИЕ УРОКОВ", "УТРЕННИЙ КОФЕ"
        ]
    };

    function getRandomElement(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    async function spinSlot(id, array) {
        const element = document.getElementById(id);
        element.classList.add('spinning');
        await new Promise(r => setTimeout(r, 150));
        element.innerText = getRandomElement(array);
        element.classList.remove('spinning');
    }

    async function spinAll() {
        await Promise.all([
            spinSlot('slot1', dictionary.who),
            spinSlot('slot2', dictionary.action),
            spinSlot('slot3', dictionary.target)
        ]);
    }

    function copyExcuse() {
        const s1 = document.getElementById('slot1').innerText;
        const s2 = document.getElementById('slot2').innerText;
        const s3 = document.getElementById('slot3').innerText;
        const fullText = `Я опоздал, потому что ${s1.toLowerCase()} ${s2.toLowerCase()} ${s3.toLowerCase()}.`;
        
        navigator.clipboard.writeText(fullText).then(() => {
            alert('Отмазка скопирована: ' + fullText);
        }).catch(() => {
            prompt("Скопируйте вручную:", fullText);
        });
    }
</script>

</body>
</html>
