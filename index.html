<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор отмазок AI</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --container-bg: #1a1a1d;
            --text-color: #ffffff;
            --accent-color: #ff3b30;
            --slot-bg: #26262b;
            --border-color: #3f3f46;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .widget {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 28px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .badge {
            background-color: var(--accent-color);
            color: white;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 14px;
            text-transform: uppercase;
        }

        .api-section {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        .api-input {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 12px;
            margin-top: 6px;
        }

        .slots-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .slot {
            background-color: var(--slot-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: 800;
            min-height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, opacity 0.2s;
            text-transform: uppercase;
        }

        .slot.spinning {
            opacity: 0.4;
            transform: scale(0.98);
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.7;
        }

        .spin-btn {
            flex-grow: 1;
            background-color: var(--accent-color);
            color: white;
            position: relative;
        }

        .spin-btn::after {
            content: '';
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
            position: absolute;
            right: 20px;
            box-shadow: 0 0 10px white;
        }

        .copy-btn {
            background-color: #323237;
            color: white;
            width: 58px;
            font-size: 20px;
        }

        .ai-generate-btn {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            margin-top: 15px;
            padding: 14px;
            font-size: 14px;
        }

        .status {
            text-align: center;
            font-size: 12px;
            color: #858591;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="widget">
    <div class="header">
        <span class="title">Я опоздал, потому что...</span>
        <span class="badge">AI BETA</span>
    </div>

    <div class="api-section">
        <label style="font-size: 12px; color: #a1a1aa;">Gemini API Key:</label>
        <input type="password" id="apiKey" class="api-input" placeholder="Вставьте ключ для ИИ генерации...">
    </div>

    <div class="slots-container">
        <div class="slot" id="slot1">КОТ</div>
        <div class="slot" id="slot2">СЪЕЛ</div>
        <div class="slot" id="slot3">БУДИЛЬНИК</div>
    </div>

    <div class="controls">
        <button class="spin-btn" onclick="spinAll()">КРУТИТЬ</button>
        <button class="copy-btn" onclick="copyText()">📋</button>
    </div>

    <button class="ai-generate-btn" onclick="generateNewBatch()">✨ Генерировать новые отмазки через ИИ</button>
    <div class="status" id="status">Локальная база: 6x5x5 вариантов</div>
</div>

<script>
    let dictionary = {
        who: ["ДЕД", "СОСЕДКА", "КОТ", "КУРЬЕР", "ИНОПЛАНЕТЯНЕ", "МЭР ГОРОДА"],
        action: ["СЛОМАЛ", "УГНАЛ", "СЪЕЛ", "ЗАБЛОКИРОВАЛ", "ПОХИТИЛ"],
        target: ["МОЙ АВТОБУС", "БУДИЛЬНИК", "ЛИФТ", "ПРОПУСК", "ШТАНЫ"]
    };

    if (localStorage.getItem('excuse_dictionary')) {
        try {
            dictionary = JSON.parse(localStorage.getItem('excuse_dictionary'));
            document.getElementById('status').innerText = "Загружена расширенная база";
        } catch(e) {
            console.error(e);
        }
    }

    function getRandom(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    async function spinSlot(slotId, array) {
        const el = document.getElementById(slotId);
        el.classList.add('spinning');
        await new Promise(r => setTimeout(r, 150));
        el.innerText = getRandom(array);
        el.classList.remove('spinning');
    }

    async function spinAll() {
        await Promise.all([
            spinSlot('slot1', dictionary.who),
            spinSlot('slot2', dictionary.action),
            spinSlot('slot3', dictionary.target)
        ]);
    }

    function copyText() {
        const s1 = document.getElementById('slot1').innerText;
        const s2 = document.getElementById('slot2').innerText;
        const s3 = document.getElementById('slot3').innerText;
        const text = `Я опоздал, потому что ${s1.toLowerCase()} ${s2.toLowerCase()} ${s3.toLowerCase()}.`;
        
        navigator.clipboard.writeText(text).then(() => {
            alert("Отмазка скопирована: " + text);
        }).catch(err => {
            prompt("Скопируйте вручную:", text);
        });
    }

    async function generateNewBatch() {
        const apiKey = document.getElementById('apiKey').value.trim();
        if (!apiKey) {
            alert("Пожалуйста, вставьте ваш Gemini API ключ в поле сверху!");
            return;
        }

        const statusEl = document.getElementById('status');
        statusEl.innerText = "Генерирую новые варианты через ИИ...";

        const promptText = `Создай JSON объект с тремя массивами русских слов в верхнем регистре: 
        "who" (существительные в именительном падеже: кто/что стало причиной, например: СОСЕД, БУДИЛЬНИК), 
        "action" (глаголы прошедшего времени мужского или общего рода, например: СЛОМАЛ, УКРАЛ), 
        "target" (существительные в винительном падеже: что пострадало, например: МОЙ ТОРТ, МАШИНУ). 
        Сделай так, чтобы они могли складываться в смешные абсурдные отмазки про опоздание. 
        Верни ТОЛЬКО валидный JSON без markdown форматирования и лишнего текста. В каждом массиве должно быть по 10 элементов.`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
            const newDict = JSON.parse(text);

            if (newDict.who && newDict.action && newDict.target) {
                dictionary = newDict;
                localStorage.setItem('excuse_dictionary', JSON.stringify(dictionary));
                statusEl.innerText = "База обновлена нейросетью!";
                spinAll();
            } else {
                statusEl.innerText = "Ошибка формата ответа ИИ.";
            }
        } catch (error) {
            console.error(error);
            statusEl.innerText = "Ошибка генерации. Проверьте API ключ.";
        }
    }
</script>

</body>
</html>
