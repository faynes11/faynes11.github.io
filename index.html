<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я опоздал, потому что...</title>
    <style>
@import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@600;700;800&display=swap');

:root {
    --velvet: #12060a;
    --oxblood: #2b0d14;
    --oxblood-hi: #451522;
    --brass: #d8a94a;
    --brass-hi: #f8e2a0;
    --brass-lo: #7d5a1d;
    --cream: #f3e9d2;
    --ink: #24150f;
    --lamp: #ffd067;
    --red: #d3142f;
    --red-lo: #7a0a1c;
    --text: #f6ecda;
    --muted: #b89c8d;
    --font-display: "Unbounded", "Arial Black", Impact, sans-serif;
    --font-main: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
}

* { -webkit-tap-highlight-color: transparent; }

html, body { max-width: 100vw; overflow-x: hidden; }

body {
    background-color: var(--velvet);
    background-image:
        radial-gradient(circle at 50% 46%, rgba(190, 24, 48, 0.30) 0%, rgba(18, 6, 10, 0) 62%),
        repeating-linear-gradient(45deg, rgba(255, 220, 160, 0.025) 0 2px, transparent 2px 10px),
        repeating-linear-gradient(-45deg, rgba(255, 220, 160, 0.025) 0 2px, transparent 2px 10px);
    color: var(--text);
    font-family: var(--font-main);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
    box-sizing: border-box;
}

button { font-family: var(--font-main); }
button:focus-visible, .slot:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 3px; }

/* ---------- corner plaques ---------- */
.made-by, .secret-btn {
    position: fixed;
    top: 14px;
    z-index: 10;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.04em;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    color: var(--ink);
    border: 1px solid #4d3410;
    box-shadow: 0 3px 0 #4d3410, 0 8px 16px rgba(0, 0, 0, 0.5);
    text-transform: none;
}
.made-by { left: 14px; pointer-events: none; }
.secret-btn {
    right: 14px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.secret-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #4d3410, 0 4px 10px rgba(0, 0, 0, 0.5); }

/* ---------- layout ---------- */
.stage-wrap { position: relative; width: 100%; max-width: 420px; padding-top: 46px; }
.widget-box { position: relative; width: 100%; }

.top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 5;
    display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap;
}
.top-group { display: flex; align-items: center; gap: 6px; }

.mini-btn {
    background: linear-gradient(180deg, var(--oxblood-hi), var(--oxblood));
    color: var(--cream);
    border: 1px solid var(--brass-lo);
    padding: 7px 11px;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.03em;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
    box-shadow: 0 3px 0 #120508, 0 6px 14px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 225, 160, 0.18);
    transition: transform 0.1s ease, box-shadow 0.1s ease, border-color 0.15s ease;
}
.mini-btn:hover { border-color: var(--brass); }
.mini-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #120508, 0 3px 8px rgba(0, 0, 0, 0.5); }
.mini-btn.muted { color: var(--muted); }
.mini-btn.life-mode { color: var(--brass-hi); border-color: var(--brass); }
.mini-btn.jp-btn { color: var(--lamp); }

.aura-canvas {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100vw; height: 100vh; max-width: 760px; max-height: 760px;
    z-index: 0; pointer-events: none; opacity: 0.8;
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 26%, rgba(0,0,0,0.4) 55%, transparent 82%);
    mask-image: radial-gradient(circle at 50% 50%, #000 26%, rgba(0,0,0,0.4) 55%, transparent 82%);
}

/* ---------- cabinet ---------- */
.widget-container {
    position: relative; z-index: 2; width: 100%; box-sizing: border-box; overflow: hidden;
    padding: 32px 22px 22px;
    border-radius: 28px;
    background:
        linear-gradient(180deg, rgba(255, 190, 150, 0.07), transparent 22%),
        linear-gradient(180deg, var(--oxblood-hi) 0%, var(--oxblood) 55%, #1c0910 100%);
    border: 3px solid var(--brass-lo);
    box-shadow:
        0 0 0 2px #2a1b08,
        0 30px 60px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(200, 24, 50, 0.25),
        inset 0 2px 0 rgba(248, 226, 160, 0.35),
        inset 0 -8px 24px rgba(0, 0, 0, 0.5);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
}

/* marquee bulbs */
.widget-container::before {
    content: ""; position: absolute; inset: 8px; border-radius: 20px;
    border: 4px dotted rgba(255, 208, 103, 0.55);
    pointer-events: none; z-index: 1;
}
.widget-container:has(.slot.spinning)::before { animation: chase 0.45s steps(1) infinite; }
.widget-container.jackpot::before { border-color: var(--lamp); animation: chase 0.25s steps(1) infinite; }
@keyframes chase {
    0%   { border-color: rgba(255, 208, 103, 1);   border-style: dotted; }
    50%  { border-color: rgba(255, 208, 103, 0.3); border-style: dotted; }
}

.widget-container.jackpot {
    border-color: var(--brass-hi);
    box-shadow:
        0 30px 65px rgba(0, 0, 0, 0.9),
        0 0 80px rgba(255, 192, 52, 0.6),
        inset 0 0 30px rgba(255, 208, 85, 0.25);
    animation: jackpotPulseGold 0.9s ease-in-out 2;
}
.gold-flash {
    position: absolute; inset: -12px; pointer-events: none; z-index: 15; opacity: 0;
    background: radial-gradient(circle at 50% 45%, rgba(255, 232, 145, 0.65) 0%, rgba(245, 175, 42, 0.25) 45%, transparent 75%);
}
.widget-container.jackpot .gold-flash { animation: goldSweep 1.1s ease-out forwards; }
@keyframes goldSweep {
    0% { opacity: 0; transform: scale(0.88); }
    25% { opacity: 1; transform: scale(1.04); }
    100% { opacity: 0; transform: scale(1.18); }
}
@keyframes jackpotPulseGold {
    0% { transform: scale(1); }
    30% { transform: scale(1.025) rotate(-0.6deg); }
    60% { transform: scale(1.02) rotate(0.6deg); }
    100% { transform: scale(1); }
}
.spark {
    position: absolute; width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle, #fff7c2 0%, #ffbe2e 65%, transparent 100%);
    box-shadow: 0 0 12px #ffd24c; pointer-events: none; z-index: 16;
    animation: sparkFly 0.95s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes sparkFly {
    0% { opacity: 1; transform: translate(0, 0) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.1); }
}

/* ---------- header ---------- */
.header {
    position: relative; z-index: 2;
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; margin-bottom: 8px; padding: 0 2px;
}
.title {
    flex: 1;
    font-family: var(--font-display);
    font-size: 21px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em;
    text-transform: none; color: var(--cream);
    text-shadow: 0 2px 0 #000, 0 0 18px rgba(255, 208, 103, 0.25);
}
.header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
.spin-counter {
    font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--lamp);
    background: #0c0305; border: 1px solid var(--brass-lo); border-radius: 6px;
    padding: 3px 8px; letter-spacing: 0.04em;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8);
}
.badge {
    background: transparent; color: var(--brass); border: 1px solid var(--brass-lo);
    padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: 0.08em;
    transition: all 0.2s ease;
}
.badge.jackpot-badge {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    color: var(--ink); border-color: var(--brass-hi); box-shadow: 0 0 16px rgba(255, 200, 60, 0.75);
}
.sub-hint {
    position: relative; z-index: 2;
    font-size: 12px; font-weight: 600; color: var(--muted);
    padding: 0 2px; margin-bottom: 14px; min-height: 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
}
.jackpot-label {
    color: var(--lamp); font-family: var(--font-display); font-weight: 800; font-size: 11px;
    text-shadow: 0 0 12px rgba(255, 195, 50, 0.7);
}

/* ---------- reels ---------- */
.slots-wrapper { position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

.slot {
    position: relative; overflow: hidden; cursor: pointer; user-select: none;
    min-height: 62px; box-sizing: border-box;
    padding: 12px 42px 12px 16px;
    display: flex; justify-content: center; align-items: center; text-align: center;
    border-radius: 10px;
    font-family: var(--font-display); font-weight: 700; font-size: 14px; line-height: 1.25;
    letter-spacing: 0.01em; text-transform: uppercase; color: var(--ink);
    background:
        linear-gradient(180deg, rgba(20, 8, 4, 0.55) 0%, rgba(20, 8, 4, 0) 26%, rgba(255, 255, 255, 0.22) 50%, rgba(20, 8, 4, 0) 74%, rgba(20, 8, 4, 0.55) 100%),
        var(--cream);
    box-shadow:
        0 0 0 3px var(--brass-lo),
        0 0 0 5px #2a1b08,
        inset 0 4px 10px rgba(0, 0, 0, 0.55),
        inset 0 -4px 10px rgba(0, 0, 0, 0.45);
    transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s ease, background-color 0.2s ease;
}
.slot.empty .slot-text { color: rgba(36, 21, 15, 0.35); letter-spacing: 0.3em; }
.slot:hover { box-shadow: 0 0 0 3px var(--brass), 0 0 0 5px #2a1b08, inset 0 4px 10px rgba(0,0,0,.55), inset 0 -4px 10px rgba(0,0,0,.45); }

.slot.locked {
    background-color: #efd18a;
    box-shadow:
        0 0 0 3px var(--brass-hi),
        0 0 0 5px #2a1b08,
        0 0 18px rgba(255, 208, 103, 0.5),
        inset 0 4px 10px rgba(0, 0, 0, 0.5),
        inset 0 -4px 10px rgba(0, 0, 0, 0.4);
}
.lock-indicator {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    font-size: 14px; opacity: 0.4; pointer-events: none; transition: opacity 0.15s ease, transform 0.15s ease;
}
.slot.locked .lock-indicator { opacity: 1; transform: translateY(-50%) scale(1.15); }

.slot.spinning { box-shadow: 0 0 0 3px #ff4a63, 0 0 0 5px #2a1b08, 0 0 22px rgba(211, 20, 47, 0.6), inset 0 4px 10px rgba(0,0,0,.55), inset 0 -4px 10px rgba(0,0,0,.45); }
.slot.spinning .slot-text { filter: blur(0.7px); animation: reelRoll 0.11s linear infinite; }
@keyframes reelRoll {
    0% { transform: translateY(-4px); }
    100% { transform: translateY(4px); }
}
.slot.landed { transform: scale(1.02); box-shadow: 0 0 0 3px var(--brass-hi), 0 0 0 5px #2a1b08, 0 0 20px rgba(255, 208, 103, 0.45), inset 0 4px 10px rgba(0,0,0,.55), inset 0 -4px 10px rgba(0,0,0,.45); }

/* ---------- credibility gauge ---------- */
.credibility-box {
    position: relative; z-index: 2;
    background: rgba(0, 0, 0, 0.28);
    border: 1px solid rgba(216, 169, 74, 0.25);
    border-radius: 12px; padding: 11px 13px; margin-bottom: 16px;
    box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
}
.credibility-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 9px; font-size: 12px; font-weight: 700; }
.credibility-label { color: var(--muted); }
.credibility-verdict { font-family: var(--font-display); font-size: 11px; font-weight: 700; color: var(--lamp); text-align: right; transition: color 0.2s ease; }
.credibility-track {
    position: relative; width: 100%; height: 10px; border-radius: 3px; overflow: hidden;
    background: #0c0305; box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9);
}
.credibility-track::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0 9px, rgba(12, 3, 5, 0.85) 9px 11px);
}
.credibility-fill {
    height: 100%; width: 0%; border-radius: 3px;
    background: linear-gradient(90deg, #d3142f 0%, #e8a33a 55%, #4fd08f 100%);
    transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ---------- buttons ---------- */
.controls { position: relative; z-index: 2; display: flex; gap: 12px; }
.spin-btn {
    flex-grow: 1; padding: 17px; border-radius: 14px; cursor: pointer;
    display: flex; justify-content: center; align-items: center; gap: 12px;
    font-family: var(--font-display); font-size: 17px; font-weight: 800; letter-spacing: 0.06em; color: #fff;
    background: linear-gradient(180deg, #f0314c 0%, var(--red) 45%, #a50e24 100%);
    border: 1px solid #ff7d90;
    box-shadow: 0 6px 0 var(--red-lo), 0 12px 24px rgba(211, 20, 47, 0.4), inset 0 2px 0 rgba(255, 255, 255, 0.35);
    text-shadow: 0 2px 0 rgba(90, 0, 15, 0.6);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.spin-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--red-lo), 0 4px 10px rgba(211, 20, 47, 0.4), inset 0 2px 0 rgba(255,255,255,.3); }
.spin-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: translateY(3px); box-shadow: 0 3px 0 var(--red-lo); }
.spin-btn::after {
    content: ""; width: 11px; height: 11px; border-radius: 50%;
    background: var(--lamp); box-shadow: 0 0 10px var(--lamp), 0 0 18px rgba(255, 208, 103, 0.8);
}

.copy-btn {
    width: 58px; border-radius: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center;
    background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
    border: 1px solid #4d3410;
    box-shadow: 0 6px 0 #4d3410, 0 12px 20px rgba(0, 0, 0, 0.45), inset 0 2px 0 rgba(255, 255, 255, 0.4);
    transition: transform 0.08s ease, box-shadow 0.08s ease; position: relative;
}
.copy-btn svg { width: 22px; height: 22px; stroke: var(--ink); }
.copy-btn:hover svg { stroke: #000; }
.copy-btn:active { transform: translateY(5px); box-shadow: 0 1px 0 #4d3410, 0 4px 10px rgba(0,0,0,.45); }

/* ---------- context chips ---------- */
.context-bar {
    position: relative; z-index: 2;
    margin-top: 18px; padding-top: 14px;
    border-top: 1px dashed rgba(216, 169, 74, 0.35);
    display: flex; flex-direction: column; gap: 9px;
}
.context-title { font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 2px; text-transform: none; letter-spacing: 0; }
.context-chips { display: flex; flex-wrap: wrap; gap: 7px; }
.context-chip {
    background: transparent; color: var(--cream);
    border: 1px solid rgba(216, 169, 74, 0.4);
    padding: 7px 11px; border-radius: 999px;
    font-size: 11px; font-weight: 800; letter-spacing: 0.02em; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease, transform 0.1s ease;
}
.context-chip:hover { border-color: var(--brass-hi); }
.context-chip:active { transform: scale(0.96); }
.context-chip.active {
    background: linear-gradient(180deg, var(--brass-hi), var(--brass));
    color: var(--ink); border-color: var(--brass-hi);
    box-shadow: 0 2px 0 var(--brass-lo);
}

/* ---------- toast ---------- */
.toast {
    position: absolute; right: 0; bottom: calc(100% + 10px); z-index: 20;
    background: var(--cream); color: var(--ink);
    border: 2px solid var(--brass); padding: 7px 12px; border-radius: 8px;
    font-size: 12px; font-weight: 800; white-space: nowrap;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7);
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ---------- modals ---------- */
.modal-backdrop {
    position: fixed; inset: 0; z-index: 50; display: none; justify-content: center; align-items: center;
    padding: 16px; box-sizing: border-box;
    background: rgba(8, 2, 4, 0.82); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
}
.modal-backdrop.active { display: flex; }
.modal-card {
    width: 100%; max-width: 360px; max-height: 82vh; overflow-y: auto; text-align: center; box-sizing: border-box;
    padding: 24px 20px; border-radius: 20px;
    background: linear-gradient(180deg, var(--oxblood-hi), var(--oxblood) 60%, #1c0910);
    border: 3px solid var(--brass-lo);
    box-shadow: 0 0 0 2px #2a1b08, 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(200, 24, 50, 0.25), inset 0 2px 0 rgba(248, 226, 160, 0.3);
}
.modal-title { font-family: var(--font-display); font-size: 12px; font-weight: 700; color: var(--brass); margin-bottom: 14px; }
.modal-text { font-family: var(--font-display); font-size: 22px; font-weight: 800; line-height: 1.2; color: var(--cream); margin-bottom: 22px; text-transform: uppercase; }
.modal-close {
    width: 100%; padding: 13px; border-radius: 12px; cursor: pointer;
    font-size: 13px; font-weight: 800; letter-spacing: 0.04em; color: #fff;
    background: linear-gradient(180deg, #f0314c, var(--red) 45%, #a50e24);
    border: 1px solid #ff7d90; box-shadow: 0 4px 0 var(--red-lo);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
}
.modal-close:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-lo); }

/* jackpot list */
.jp-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; text-align: left; }
.jp-item {
    position: relative; overflow: hidden; padding: 12px 14px; border-radius: 12px;
    background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(216, 169, 74, 0.2);
}
.jp-item.unlocked {
    background: linear-gradient(180deg, rgba(216, 169, 74, 0.28), rgba(125, 90, 29, 0.2));
    border-color: var(--brass);
}
.jp-item-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; font-size: 11px; font-weight: 800; color: var(--cream); }
.jp-status-open { color: var(--lamp); }
.jp-status-locked { color: var(--muted); }
.jp-secret-box { position: relative; overflow: hidden; border-radius: 8px; padding: 7px 9px; background: rgba(0, 0, 0, 0.35); }
.jp-combo { font-size: 13px; font-weight: 800; line-height: 1.35; color: var(--cream); transition: filter 0.25s ease, opacity 0.25s ease; }
.jp-item.locked-jp .jp-combo { filter: blur(8px); -webkit-filter: blur(8px); opacity: 0.35; user-select: none; }
.jp-blur-veil { display: none; }
.jp-item.locked-jp .jp-blur-veil {
    display: flex; align-items: center; justify-content: center; position: absolute; inset: 0;
    background: rgba(18, 6, 10, 0.55); backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    font-size: 11px; font-weight: 800; color: var(--muted); pointer-events: none;
}

/* ---------- small screens & motion ---------- */
@media (max-width: 380px) {
    .title { font-size: 18px; }
    .slot { font-size: 12.5px; padding-right: 36px; }
    .mini-btn { padding: 6px 8px; font-size: 10px; }
}
@media (prefers-reduced-motion: reduce) {
    .widget-container::before, .slot.spinning .slot-text, .widget-container.jackpot { animation: none !important; }
}
    </style>
</head>
<body>

<div class="made-by">сделано михуньчиком ❤️</div>
<button class="secret-btn" onclick="openSecret()">ТЫК 👆</button>

<div class="modal-backdrop" id="secretModal" onclick="handleBackdropClick(event, 'secretModal')">
    <div class="modal-card">
        <div class="modal-title">Секрет раскрыт</div>
        <div class="modal-text">дилюрка лох</div>
        <button class="modal-close" onclick="closeModal('secretModal')">Закрыть</button>
    </div>
</div>

<div class="modal-backdrop" id="jackpotsModal" onclick="handleBackdropClick(event, 'jackpotsModal')">
    <div class="modal-card">
        <div class="modal-title" id="jpModalTitle">Джекпоты (0/7)</div>
        <div class="jp-list" id="jpList"></div>
        <button class="modal-close" onclick="closeModal('jackpotsModal')">Закрыть</button>
    </div>
</div>

<div class="stage-wrap">
    <div class="top-bar">
        <div class="top-group">
            <button class="mini-btn" id="toneBtn" onclick="toggleTone()" title="Переключить стиль отмазок">
                <span id="toneIcon">🤪</span>
                <span id="toneLabel">АБСУРД</span>
            </button>
            <button class="mini-btn jp-btn" id="jpBtn" onclick="openJackpotsModal()" title="Список джекпотов">
                <span>🏆</span>
                <span id="jpBtnLabel">ДЖЕКПОТЫ 0/7</span>
            </button>
        </div>

        <button class="mini-btn" id="soundBtn" onclick="toggleSound()" title="Переключить звук прокрутки">
            <span id="soundIcon">🔊</span>
            <span id="soundLabel">ЗВУК ВКЛ</span>
        </button>
    </div>

            const found = packs[toneKey].target.find(t => t.text === targetText);
            if (found) return found;

        return null;

    function inflectVerb(verbObj, gender) {
        if (!verbObj) return EMPTY_SYMBOL;
        return verbObj[gender] || verbObj.m;

    function countSharedTags(tagsA = [], tagsB = []) {
        if (!Array.isArray(tagsA) || !Array.isArray(tagsB)) return 0;
        const setB = new Set(tagsB);
        let shared = 0;
        for (const t of tagsA) {
            if (setB.has(t)) shared += 1;
        }
        return shared;
    }

    function getContextFitScore(itemTags = [], ctxKey = 'any') {
        if (!ctxKey || ctxKey === 'any' || !CONTEXT_META[ctxKey]) return 0.75;
        const fitTags = CONTEXT_META[ctxKey].fitTags || [];
        if (fitTags.length === 0) return 0.75;
        const hasDirectCtx = itemTags.includes(ctxKey);
        const shared = countSharedTags(itemTags, fitTags);
        if (hasDirectCtx) return 1.0;
        if (shared >= 2) return 0.85;
        if (shared === 1) return 0.65;
        return 0.25;
    }

    function computeCredibility() {
        const s1 = slotValues[0];
        const s2 = slotValues[1];
        const s3 = slotValues[2];

        if (s1 === EMPTY_SYMBOL || s2 === EMPTY_SYMBOL || s3 === EMPTY_SYMBOL) {
            return {
                percent: null,
                verdict: 'ОЖИДАЕТ СТАРТА',
                color: '#aba5b0'
            };
        }

        const wObj = findWhoObj(s1);
        const aObj = currentVerbObj || findActionVerbObj(s2);
        const tObj = findTargetObj(s3);

        const r1 = wObj && typeof wObj.r === 'number' ? wObj.r : (currentTone === 'life' ? 0.8 : 0.35);
        const r2 = aObj && typeof aObj.r === 'number' ? aObj.r : (currentTone === 'life' ? 0.8 : 0.35);
        const r3 = tObj && typeof tObj.r === 'number' ? tObj.r : (currentTone === 'life' ? 0.8 : 0.45);

        const t1 = wObj?.tags || [];
        const t2 = aObj?.tags || [];
        const t3 = tObj?.tags || [];

        const match12 = countSharedTags(t1, t2) > 0;
        const match23 = countSharedTags(t2, t3) > 0;
        const match13 = countSharedTags(t1, t3) > 0;
        const coherence = (match12 ? 0.4 : 0) + (match23 ? 0.4 : 0) + (match13 ? 0.2 : 0);
        const coherenceModifier = (coherence - 0.5) * 0.34;

        let ctxModifier = 0;
        if (currentContext !== 'any') {
            const fitAvg = (
                getContextFitScore(t1, currentContext) +
                getContextFitScore(t2, currentContext) +
                getContextFitScore(t3, currentContext)
            ) / 3;
            ctxModifier = (fitAvg - 0.55) * 0.28;
        }

        const modeModifier = currentTone === 'life' ? 0.04 : -0.14;
        const minPenalty = Math.min(r1, r2, r3) < 0.14 ? -0.12 : 0;

        const baseScore = r1 * 0.32 + r2 * 0.36 + r3 * 0.32;
        const raw = baseScore + coherenceModifier + ctxModifier + modeModifier + minPenalty;
        const percent = Math.max(2, Math.min(97, Math.round(raw * 100)));

        let verdict = 'СОМНИТЕЛЬНО';
        let color = '#e09f3e';

        if (percent >= 80) {
            verdict = 'ЖЕЛЕЗОБЕТОННО';
            color = '#48c78e';
        } else if (percent >= 60) {
            verdict = 'ПОТЯНЕТ';
            color = '#9fd356';
        } else if (percent >= 38) {
            verdict = 'НАТЯЖКА';
            color = '#e09f3e';
        } else if (percent >= 18) {
            verdict = 'ПАХНЕТ ФАНТАЗИЕЙ';
            color = '#f06449';
        } else {
            verdict = 'АБСУРД 100/10';
            color = '#ff3b5c';
        }

        return { percent, verdict, color };
    }

        fillEl.style.width = `${info.percent}%`;
    }

                    <div class="jp-combo">${jp.who} • ${matchedVerb} • ${jp.target}</div>
                    <div class="jp-blur-veil">Ещё не выбит</div>
                </div>
            `;
            listEl.appendChild(item);
        });
    }

    function openJackpotsModal() {
        updateJackpotCounterUI();
        renderJackpotsList();
        document.getElementById('jackpotsModal').classList.add('active');
    }

    function syncSpinButtonState() {
        const spinBtn = document.getElementById('spinBtn');
        spinBtn.disabled = isSpinning || isJackpotAnimating;
    }

    (function initCenterRaysAura() {
        const canvas = document.getElementById('auraCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        function resize() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = Math.max(1, Math.floor(rect.width * dpr));
            canvas.height = Math.max(1, Math.floor(rect.height * dpr));
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resize();
        window.addEventListener('resize', resize);

        const rays = [
            { angle: -2.65, jitter: 0.24, freq: 5.2, speed: 1.9, phase: 0.2,  length: 0.56, width: 14 },
            { angle: -2.15, jitter: 0.28, freq: 6.1, speed: 2.3, phase: 1.4,  length: 0.62, width: 16 },
            { angle: -1.55, jitter: 0.22, freq: 4.8, speed: 1.6, phase: 2.6,  length: 0.54, width: 13 },
            { angle: -0.92, jitter: 0.27, freq: 5.8, speed: 2.1, phase: 3.8,  length: 0.60, width: 15 },
            { angle: -0.35, jitter: 0.25, freq: 6.4, speed: 2.4, phase: 0.9,  length: 0.58, width: 14 },
            { angle:  0.32, jitter: 0.26, freq: 5.0, speed: 1.8, phase: 2.1,  length: 0.57, width: 14 },
            { angle:  0.95, jitter: 0.29, freq: 6.2, speed: 2.2, phase: 3.4,  length: 0.62, width: 16 },
            { angle:  1.58, jitter: 0.23, freq: 4.9, speed: 1.7, phase: 4.7,  length: 0.55, width: 13 },
            { angle:  2.22, jitter: 0.28, freq: 5.9, speed: 2.0, phase: 1.1,  length: 0.61, width: 15 },
            { angle:  2.78, jitter: 0.25, freq: 5.5, speed: 1.9, phase: 2.9,  length: 0.56, width: 14 }
        ];

        let t = 0;
        let lastTime = performance.now();

        function drawRay(cx, cy, maxR, ray, time) {
            const steps = 36;
            const len = maxR * ray.length * (0.88 + Math.sin(time * 1.4 + ray.phase) * 0.12 + auraBoost * 0.18);
            const pts = [];

            for (let i = 0; i <= steps; i++) {
                const u = i / steps;
                const dist = u * len;
                const sway =
                    Math.sin(u * ray.freq + time * ray.speed + ray.phase) * ray.jitter * u +
                    Math.cos(u * (ray.freq * 1.7) - time * (ray.speed * 1.3) + ray.phase * 1.5) * (ray.jitter * 0.45) * u;
                const a = ray.angle + sway;
                pts.push({
                    x: cx + Math.cos(a) * dist,
                    y: cy + Math.sin(a) * dist
                });
            }

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = `rgba(215, 28, 56, ${0.42 + auraBoost * 0.18})`;
            ctx.lineWidth = ray.width * (2.2 + auraBoost * 0.6);
            ctx.shadowColor = 'rgba(225, 32, 62, 0.75)';
            ctx.shadowBlur = 22 + auraBoost * 12;
            ctx.stroke();

            const endP = pts[pts.length - 1];
            const grad = ctx.createLinearGradient(cx, cy, endP.x, endP.y);
            grad.addColorStop(0, 'rgba(255, 210, 195, 0.95)');
            grad.addColorStop(0.45, 'rgba(255, 85, 115, 0.85)');
            grad.addColorStop(1, 'rgba(210, 25, 55, 0)');

            ctx.beginPath();
            pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = grad;
            ctx.lineWidth = ray.width * (0.45 + auraBoost * 0.2);
            ctx.shadowColor = 'rgba(255, 115, 135, 0.9)';
            ctx.shadowBlur = 10;
            ctx.stroke();

            ctx.restore();
        }

        function frame(now) {
            const dt = Math.min((now - lastTime) / 1000, 0.05);
            lastTime = now;

            auraBoost = Math.max(0, auraBoost - dt * 0.55);
            t += dt * (1.0 + auraBoost * 2.1);

            const w = canvas.width / dpr;
            const h = canvas.height / dpr;
            const cx = w * 0.5;
            const cy = h * 0.5;
            const maxR = Math.max(w, h) * 0.5;

            ctx.clearRect(0, 0, w, h);

            const coreGlow = ctx.createRadialGradient(cx, cy, 4, cx, cy, maxR * 0.45);
            coreGlow.addColorStop(0, `rgba(235, 42, 70, ${0.52 + auraBoost * 0.2})`);
            coreGlow.addColorStop(0.6, `rgba(155, 18, 42, ${0.22 + auraBoost * 0.1})`);
            coreGlow.addColorStop(1, 'rgba(14, 14, 16, 0)');
            ctx.fillStyle = coreGlow;
            ctx.fillRect(0, 0, w, h);

            ctx.globalCompositeOperation = 'lighter';
            for (const ray of rays) {
                drawRay(cx, cy, maxR, ray, t);
            }
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(frame);
        }

        requestAnimationFrame(frame);
    })();

    function ensureAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioCtx) {
            audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume().catch(() => {});
        }
        return audioCtx;
    }

    function playTickSound(progress = 0) {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        const baseFreq = 520 - progress * 160 + (Math.random() * 60 - 30);
        osc.frequency.setValueAtTime(baseFreq, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.028);

        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.03);
    }

    function playStopSound(reelIndex = 0) {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        const freq = 220 + reelIndex * 55;
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(85, now + 0.09);

        gain.gain.setValueAtTime(0.16, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + 0.095);
    }

    function playJackpotSound() {
        if (!isSoundEnabled) return;
        const ctx = ensureAudioContext();
        if (!ctx) return;

        const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
        notes.forEach((freq, i) => {
            const now = ctx.currentTime + i * 0.075;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.14, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now);
            osc.stop(now + 0.29);
        });
    }

    function spawnGoldSparks() {
        const card = document.getElementById('widgetCard');
        const count = 24;
        for (let i = 0; i < count; i++) {
            const spark = document.createElement('span');
            spark.className = 'spark';
            const angle = (Math.PI * 2 * i) / count + (Math.random() * 0.3 - 0.15);
            const dist = 70 + Math.random() * 110;
            spark.style.left = '50%';
            spark.style.top = '48%';
            spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
            spark.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
            card.appendChild(spark);
            setTimeout(() => spark.remove(), 1000);
        }
    }

    function toggleSound() {
        isSoundEnabled = !isSoundEnabled;
        applySoundUI();
        saveMemory();
        if (isSoundEnabled) {
            playStopSound(1);
        }
    }

    function toggleTone() {
        if (isSpinning || isJackpotAnimating) return;
        currentTone = currentTone === 'absurd' ? 'life' : 'absurd';
        applyToneUI();
        updateCredibilityUI();
        saveMemory();
        playStopSound(0);
    }

    function toggleLock(index) {
        if (isSpinning || isJackpotAnimating) return;
        locked[index] = !locked[index];
        const slotEl = document.getElementById(slotIds[index]);
        const iconEl = document.getElementById('lockIcon' + index);

        if (locked[index]) {
            slotEl.classList.add('locked');
            iconEl.innerText = '🔒';
        } else {
            slotEl.classList.remove('locked');
            iconEl.innerText = '🔓';
        }
        saveMemory();
        playStopSound(index);
    }

    function openSecret() {
        document.getElementById('secretModal').classList.add('active');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('active');
    }

    function handleBackdropClick(event, id) {
        if (event.target.id === id) {
            closeModal(id);
        }
    }

    function getSlotTextEl(id) {
        return document.getElementById(id).querySelector('.slot-text');
    }

    function getOptionLabel(item, gender = 'm') {
        if (typeof item === 'string') return item;
        if (item && typeof item.text === 'string') return item.text;
        if (item && typeof item.m === 'string') return inflectVerb(item, gender);
        return EMPTY_SYMBOL;
    }

    function pickWeightedFromPool(pool, contextTags = [], ctxKey = 'any') {
        const fitTags = (ctxKey && ctxKey !== 'any' && CONTEXT_META[ctxKey])
            ? CONTEXT_META[ctxKey].fitTags
            : [];

        const weights = pool.map(item => {
            const itemTags = item.tags || [];
            let w = 1;
            if (Array.isArray(contextTags) && contextTags.length > 0) {
                const shared = countSharedTags(itemTags, contextTags);
                w *= shared > 0 ? 1 + shared * 3.2 : 0.45;
            }
            if (fitTags.length > 0) {
                const ctxShared = countSharedTags(itemTags, fitTags);
                const direct = itemTags.includes(ctxKey) ? 2.2 : 0;
                w *= (ctxShared > 0 || direct > 0) ? 1 + ctxShared * 1.6 + direct : 0.35;
            }
            return w;
        });

        const totalWeight = weights.reduce((acc, w) => acc + w, 0);
        let roll = Math.random() * totalWeight;
        for (let i = 0; i < pool.length; i++) {
            roll -= weights[i];
            if (roll <= 0) return pool[i];
        }
        return pool[pool.length - 1];
    }

    function pickNextItem(array, currentLabel, history = null, gender = 'm', contextTags = [], ctxKey = 'any') {
        if (!array || array.length === 0) return { label: EMPTY_SYMBOL, raw: null };
        if (array.length === 1) {
            const raw = array[0];
            return { label: getOptionLabel(raw, gender), raw };
        }
        const blocked = new Set([currentLabel, ...(history || [])]);
        const filtered = array.filter(item => !blocked.has(getOptionLabel(item, gender)));
        const fallback = array.filter(item => getOptionLabel(item, gender) !== currentLabel);
        const source = filtered.length > 0 ? filtered : (fallback.length > 0 ? fallback : array);
        const raw = pickWeightedFromPool(source, contextTags, ctxKey);
        return { label: getOptionLabel(raw, gender), raw };
    }

    function recordHistory(reelIndex, value) {
        const hist = recentHistory[reelIndex];
        hist.push(value);
        if (hist.length > 4) {
            hist.shift();
        }
    }

    function spinReel(id, array, durationMs, reelIndex, getOptionsFn = null) {
        return new Promise(resolve => {
            const element = document.getElementById(id);
            const textEl = getSlotTextEl(id);

            if (locked[reelIndex]) {
                resolve({ raw: null, label: textEl.innerText });
                return;
            }

            element.classList.remove('empty', 'landed');
            element.classList.add('spinning');

            const startTime = performance.now();
            let tickDelay = 55;

            function step() {
                const elapsed = performance.now() - startTime;
                const progress = Math.min(elapsed / durationMs, 1);
                const opts = getOptionsFn ? getOptionsFn() : { gender: currentGender, tags: [], ctxKey: currentContext };
                const g = opts.gender || currentGender;
                const tags = opts.tags || [];
                const ctxKey = opts.ctxKey || currentContext;

                if (elapsed >= durationMs) {
                    const picked = pickNextItem(array, textEl.innerText, recentHistory[reelIndex], g, tags, ctxKey);
                    setSlotDisplay(reelIndex, picked.label);
                    recordHistory(reelIndex, picked.label);
                    element.classList.remove('spinning');
                    element.classList.add('landed');
                    playStopSound(reelIndex);
                    setTimeout(() => element.classList.remove('landed'), 220);
                    resolve(picked);
                    return;
                }

                const tickPicked = pickNextItem(array, textEl.innerText, null, g, tags, ctxKey);
                textEl.innerText = tickPicked.label;
                playTickSound(progress);

                tickDelay = 55 + Math.pow(progress, 2.2) * 145;
                setTimeout(step, tickDelay);
            }

            step();
        });
    }

    function resetJackpotVisual() {
        const card = document.getElementById('widgetCard');
        const badge = document.getElementById('mainBadge');
        const banner = document.getElementById('jackpotBanner');
        card.classList.remove('jackpot');
        badge.classList.remove('jackpot-badge');
        badge.innerText = 'SLOTS';
        banner.innerText = '';
    }

    function triggerJackpotCelebration(jp) {
        const card = document.getElementById('widgetCard');
        const badge = document.getElementById('mainBadge');
        const banner = document.getElementById('jackpotBanner');

        clearTimeout(jackpotUnlockTimer);
        isJackpotAnimating = true;
        syncSpinButtonState();

        resetJackpotVisual();
        void card.offsetWidth;

        card.classList.add('jackpot');
        badge.classList.add('jackpot-badge');
        badge.innerText = 'JACKPOT';
        banner.innerText = `★ ДЖЕКПОТ: ${jp.name} ★`;
        auraBoost = 1.8;

        if (!unlockedIds.includes(jp.id)) {
            unlockedIds.push(jp.id);
            updateJackpotCounterUI();
        }
        saveMemory();

        spawnGoldSparks();
        playJackpotSound();

        jackpotUnlockTimer = setTimeout(() => {
            isJackpotAnimating = false;
            syncSpinButtonState();
        }, 1850);
    }

    function evaluateMatchedJackpot() {
        if (currentTone !== 'absurd') return null;
        const s1 = slotValues[0];
        const s2 = slotValues[1];
        const s3 = slotValues[2];
        if (s1 === EMPTY_SYMBOL || s2 === EMPTY_SYMBOL || s3 === EMPTY_SYMBOL) return null;

        const exact = JACKPOTS.find(jp => {
            const jpVerb = inflectVerb(findActionVerbObj(jp.actionBase), jp.whoGender);
            return jp.who === s1 && jpVerb === s2 && jp.target === s3;
        });
        if (exact) return exact;

        const heroMatch = JACKPOTS.find(jp => jp.who === s1);
        if (heroMatch && Math.random() < heroMatch.chance) {
            return heroMatch;
        }
        return null;
    }

    async function spinAll() {
        if (isSpinning || isJackpotAnimating) return;
        if (locked.every(Boolean)) return;

        isSpinning = true;
        syncSpinButtonState();
        updateCredibilityUI();
        auraBoost = 1.1;
        resetJackpotVisual();
        ensureAudioContext();

        spinCount += 1;
        document.getElementById('spinCounter').innerText = '#' + spinCount;
        saveMemory();

        const dict = packs[currentTone];

        let activeWhoObj = slotValues[0] !== EMPTY_SYMBOL ? findWhoObj(slotValues[0]) : null;
        let activeGender = activeWhoObj ? activeWhoObj.g : currentGender;
        let activeTags = activeWhoObj ? (activeWhoObj.tags || []) : [];

        const res1 = await spinReel('slot1', dict.who, 950, 0, () => ({
            gender: activeGender,
            tags: [],
            ctxKey: currentContext
        }));
        if (!locked[0] && res1 && res1.raw) {
            activeWhoObj = res1.raw;
            activeGender = res1.raw.g || 'm';
            activeTags = res1.raw.tags || [];
            currentGender = activeGender;
        }

        const [res2, res3] = await Promise.all([
            spinReel('slot2', dict.action, 1350, 1, () => ({
                gender: activeGender,
                tags: activeTags,
                ctxKey: currentContext
            })),
            spinReel('slot3', dict.target, 1750, 2, () => {
                const verbTags = (!locked[1] && currentVerbObj?.tags) ? currentVerbObj.tags : [];
                return {
                    gender: activeGender,
                    tags: [...activeTags, ...verbTags],
                    ctxKey: currentContext
                };
            })
        ]);

        if (!locked[1] && res2 && res2.raw) {
            currentVerbObj = res2.raw;
            setSlotDisplay(1, inflectVerb(currentVerbObj, activeGender));
        } else if (!locked[1] && slotValues[1] !== EMPTY_SYMBOL) {
            syncSecondSlotGender();
        }

        if (!locked[2] && res3 && res3.label) {
            setSlotDisplay(2, res3.label);
        }

        isSpinning = false;
        updateCredibilityUI();
        saveMemory();

        const hit = evaluateMatchedJackpot();

        if (hit) {
            triggerJackpotCelebration(hit);
        } else {
            syncSpinButtonState();
        }
    }

    function showToast(msg = 'Скопировано') {
        const toast = document.getElementById('copyToast');
        toast.innerText = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 1500);
    }

    function copyExcuse() {
        const s1 = slotValues[0];
        const s2 = slotValues[1];
        const s3 = slotValues[2];
        if (s1 === EMPTY_SYMBOL || s2 === EMPTY_SYMBOL || s3 === EMPTY_SYMBOL) {
            showToast('Сначала покрути');
            return;
        }
        const cred = computeCredibility();
        const ctxLabel = (CONTEXT_META[currentContext] && currentContext !== 'any')
            ? `${CONTEXT_META[currentContext].label}, `
            : '';
        const fullText = `Я опоздал, потому что ${s1.toLowerCase()} ${s2.toLowerCase()} ${s3.toLowerCase()} (${ctxLabel}правдоподобность: ${cred.percent}%).`;

        navigator.clipboard.writeText(fullText).then(() => {
            showToast('Скопировано');
        }).catch(() => {
            prompt("Скопируйте вручную:", fullText);
        });
    }
